<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>日光慢慢：巷口的故事</title><style>
:root{--ink:#51463c;--cream:#f8f2e4;--leaf:#78846b;--wood:#966f51}*{box-sizing:border-box}body{margin:0;background:#ded8c8;color:var(--ink);font-family:system-ui,'PingFang TC',sans-serif}button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:11px 15px;background:#72836d;color:white}button:disabled{opacity:.45;cursor:not-allowed}button.secondary{background:#e9e1d0;color:var(--ink)}button:focus-visible{outline:3px solid #cb9b54;outline-offset:2px}.wrap{max-width:1000px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h1{font-family:serif;letter-spacing:.14em;font-size:clamp(24px,5vw,38px);margin:4px 0}h2{font-size:19px;margin:0 0 10px}.small{font-size:13px;color:#796f60}.stats{display:flex;gap:8px;flex-wrap:wrap}.pill{background:#f8f2e5;border-radius:20px;padding:8px 13px;font-size:14px}.scene{position:relative;height:240px;border:9px solid #e9deca;border-radius:18px;overflow:hidden;background:linear-gradient(165deg,#e9e1ce 0 68%,#b89170 68%);box-shadow:0 8px 20px #76674c22;margin:18px 0}.window{position:absolute;left:8%;top:10%;width:34%;height:57%;border:9px solid #8e755c;background:linear-gradient(145deg,#c5d9bd,#f7e7af);box-shadow:inset 0 0 0 3px #eee2c9}.window:before,.window:after{content:'';position:absolute;background:#8e755c}.window:before{width:6px;height:100%;left:49%}.window:after{height:6px;width:100%;top:50%}.sun{position:absolute;left:28%;top:0;width:33%;height:100%;background:#fff7cf44;transform:skew(-22deg)}.sign{position:absolute;top:12%;right:12%;font-family:serif;letter-spacing:.25em;color:#82684f}.table{position:absolute;bottom:14%;left:42%;width:35%;height:16px;background:#7c593f;border-radius:50%;box-shadow:0 9px 0 #634832}.table:after{content:'';position:absolute;width:8px;height:58px;background:#73533f;left:48%;top:10px}.chair{position:absolute;bottom:10%;font-size:48px;left:30%}.plant{position:absolute;bottom:5%;right:5%;font-size:58px}.decor{position:absolute;right:23%;top:35%;font-size:35px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.panel{background:var(--cream);border:1px solid #e5d8c0;border-radius:16px;padding:18px;box-shadow:0 5px 15px #77695018}.wide{grid-column:1/-1}.items{display:flex;gap:8px;flex-wrap:wrap}.item{background:#fffaf0;border:1px solid #e5d8c6;border-radius:12px;padding:10px;flex:1;min-width:130px}.item strong{display:block;margin-bottom:5px}.item button{margin-top:8px;width:100%}.notice{background:#eee6d5;border-left:4px solid #a3a985;padding:12px;border-radius:6px;line-height:1.7;white-space:pre-line}.story{background:#fffaf0;padding:14px;border-radius:12px;line-height:1.8;white-space:pre-line}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.footer{text-align:center;padding:22px;font-size:12px;color:#817667}@media(max-width:650px){.wrap{padding:12px}.grid{grid-template-columns:1fr}.wide{grid-column:auto}.scene{height:190px}.panel{padding:15px}.chair{font-size:38px}}
</style></head><body><main class="wrap"><header class="top"><div><div class="small">一間藏在巷子裡的老宅早午餐店</div><h1>日光慢慢 <span style="font-size:.55em">｜巷口的故事</span></h1></div><div class="stats" id="stats"></div></header><div class="scene" aria-label="陽光照進老宅餐廳，窗邊擺著桌椅和植物"><div class="window"></div><div class="sun"></div><div class="sign">日光慢慢</div><div class="table"></div><div class="chair">🪑</div><div class="plant" id="plant">🪴</div><div class="decor" id="decor"></div></div><div class="grid"><section class="panel wide"><h2 id="phaseTitle"></h2><div id="main"></div></section><section class="panel"><h2>📖 巷口的故事</h2><div class="story" id="story"></div></section><section class="panel"><h2>🌿 小店布置</h2><div id="shop"></div></section></div><div class="footer">慢慢來，今天也會是溫暖的一天。<br><button class="secondary" id="reset" style="margin-top:12px;font-size:12px">重新開始遊戲</button></div></main><script>
const KEY='sunshine-cafe-v1';const menu=[{id:'toast',name:'🍞 奶油厚吐司',price:80},{id:'egg',name:'🍳 太陽蛋早午餐',price:120},{id:'coffee',name:'☕ 手沖咖啡',price:70},{id:'tea',name:'🍵 蜂蜜紅茶',price:60}];const furniture=[{id:'plant',name:'🌿 窗邊綠植',price:120},{id:'lamp',name:'💡 復古吊燈',price:180},{id:'photo',name:'🖼️ 木框照片',price:240}];const stories=['帶著舊相機的女孩走進店裡，坐在窗邊。\n「我叫小晴，昨天才搬到這附近。這裡的陽光真好。」','小晴再次推開門，手裡多了一卷底片。\n「我今天沿著巷子散步，拍到一隻在屋簷下睡覺的貓。」','小晴帶來沖洗好的照片，輕輕放在桌上。\n「搬來的時候有點緊張，但現在覺得，這條街好像慢慢變熟悉了。」','小晴又來喝下午茶，分享她在街角發現的小花店。\n「下次我想拍一張這間店的照片。」'];let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!state||!Array.isArray(state.selected)||!Array.isArray(state.owned)||!['setup','service','closed'].includes(state.phase))state={day:1,money:100,phase:'setup',selected:[],owned:[],served:0,stage:'order',order:null,storyCount:0,story:'故事會在招待熟客時自然展開。'};function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}function render(){save();document.querySelector('#stats').innerHTML=`<span class="pill">☀️ 第 ${state.day} 天</span><span class="pill">🪙 ${state.money} 元</span><span class="pill">🍽️ 今日 ${state.served} / 3 位</span>`;document.querySelector('#plant').textContent=state.owned.includes('plant')?'🌳':'🪴';document.querySelector('#decor').textContent=(state.owned.includes('lamp')?'💡 ':'')+(state.owned.includes('photo')?'🖼️':'');document.querySelector('#story').textContent=state.story;document.querySelector('#shop').innerHTML=furniture.map(x=>`<div class="item" style="margin-bottom:8px"><strong>${x.name}</strong>${state.owned.includes(x.id)?'已擁有':`${x.price} 元 <button data-buy="${x.id}" ${state.money<x.price?'disabled':''}>添購</button>`}</div>`).join('');let title='',html='';if(state.phase==='setup'){title='① 準備今天的菜單';html='<div class="notice">選擇兩道餐點或飲品，客人會從中自己點餐。沒有倒數計時，慢慢來就好。</div><div class="items" style="margin-top:12px">'+menu.map(x=>`<div class="item"><strong>${x.name}</strong>${x.price} 元<button class="${state.selected.includes(x.id)?'':'secondary'}" data-select="${x.id}">${state.selected.includes(x.id)?'✓ 已選擇':'選入菜單'}</button></div>`).join('')+'</div><div class="actions"><button id="open" '+(state.selected.length===2?'':'disabled')+'>開始營業（已選 '+state.selected.length+' / 2）</button></div>'}else if(state.phase==='service'){let food=menu.find(x=>x.id===state.order);title='② 營業時間';let customer=state.served===0?'📷 熟客小晴':state.served===1?'👩‍💼 巷口的上班族':'👴 附近的鄰居';html=`<div class="notice">${customer} 來店裡了！\n點了一份：${food.name}（${food.price} 元）</div><div class="actions">${state.stage==='order'?'<button id="cook">製作餐點</button>':'<button id="serve">送上餐點</button>'}</div><p class="small">${state.stage==='ready'?'餐點準備好了，點擊送餐吧。':'點擊製作，準備好後再送給客人。'}</p>`}else{title='③ 今天打烊了';html=`<div class="notice">辛苦了！今天招待了 3 位客人，收入 ${state.earned} 元。\n可以用收入添購布置，再迎接新的一天。</div><div class="actions"><button id="next">迎接第 ${state.day+1} 天</button></div>`}document.querySelector('#phaseTitle').textContent=title;document.querySelector('#main').innerHTML=html;bind()}
function bind(){document.querySelectorAll('[data-select]').forEach(b=>b.onclick=()=>{let id=b.dataset.select;if(state.selected.includes(id))state.selected=state.selected.filter(x=>x!==id);else if(state.selected.length<2)state.selected.push(id);render()});document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{let x=furniture.find(y=>y.id===b.dataset.buy);if(!state.owned.includes(x.id)&&state.money>=x.price){state.money-=x.price;state.owned.push(x.id);render()}});let open=document.querySelector('#open');if(open)open.onclick=()=>{state.phase='service';state.served=0;state.earned=0;newOrder();render()};let cook=document.querySelector('#cook');if(cook)cook.onclick=()=>{state.stage='ready';render()};let serve=document.querySelector('#serve');if(serve)serve.onclick=()=>{let food=menu.find(x=>x.id===state.order);state.money+=food.price;state.earned+=food.price;if(state.served===0){state.story=stories[Math.min(state.storyCount,stories.length-1)];state.storyCount++}state.served++;if(state.served===3){state.phase='closed';state.order=null}else newOrder();render()};let next=document.querySelector('#next');if(next)next.onclick=()=>{state.day++;state.phase='setup';state.selected=[];state.served=0;render()}}function newOrder(){state.order=state.selected[state.served%state.selected.length];state.stage='order'}document.querySelector('#reset').onclick=()=>{if(confirm('確定要重新開始嗎？目前進度會被清除。')){try{localStorage.removeItem(KEY)}catch(e){}location.reload()}};render();
</script></body></html>
