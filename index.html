<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>日光慢慢：巷口的故事</title><style>
:root{--ink:#51463c;--cream:#f8f2e4;--leaf:#78846b;--wood:#966f51}*{box-sizing:border-box}body{margin:0;background:#ded8c8;color:var(--ink);font-family:system-ui,'PingFang TC',sans-serif}button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:11px 15px;background:#72836d;color:white}button:disabled{opacity:.45;cursor:not-allowed}button.secondary{background:#e9e1d0;color:var(--ink)}button:focus-visible{outline:3px solid #cb9b54;outline-offset:2px}.wrap{max-width:1000px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h1{font-family:serif;letter-spacing:.14em;font-size:clamp(24px,5vw,38px);margin:4px 0}h2{font-size:19px;margin:0 0 10px}.small{font-size:13px;color:#796f60}.stats{display:flex;gap:8px;flex-wrap:wrap}.pill{background:#f8f2e5;border-radius:20px;padding:8px 13px;font-size:14px}.scene{position:relative;height:240px;border:9px solid #e9deca;border-radius:18px;overflow:hidden;background:linear-gradient(165deg,#e9e1ce 0 68%,#b89170 68%);box-shadow:0 8px 20px #76674c22;margin:18px 0}.window{position:absolute;left:8%;top:10%;width:34%;height:57%;border:9px solid #8e755c;background:linear-gradient(145deg,#c5d9bd,#f7e7af);box-shadow:inset 0 0 0 3px #eee2c9}.window:before,.window:after{content:'';position:absolute;background:#8e755c}.window:before{width:6px;height:100%;left:49%}.window:after{height:6px;width:100%;top:50%}.sun{position:absolute;left:28%;top:0;width:33%;height:100%;background:#fff7cf44;transform:skew(-22deg)}.sign{position:absolute;top:12%;right:12%;font-family:serif;letter-spacing:.25em;color:#82684f}.table{position:absolute;bottom:14%;left:42%;width:35%;height:16px;background:#7c593f;border-radius:50%;box-shadow:0 9px 0 #634832}.table:after{content:'';position:absolute;width:8px;height:58px;background:#73533f;left:48%;top:10px}.chair{position:absolute;bottom:10%;font-size:48px;left:30%}.plant{position:absolute;bottom:5%;right:5%;font-size:58px}.decor{position:absolute;right:23%;top:35%;font-size:35px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.panel{background:var(--cream);border:1px solid #e5d8c0;border-radius:16px;padding:18px;box-shadow:0 5px 15px #77695018}.wide{grid-column:1/-1}.items{display:flex;gap:8px;flex-wrap:wrap}.item{background:#fffaf0;border:1px solid #e5d8c6;border-radius:12px;padding:10px;flex:1;min-width:130px}.item strong{display:block;margin-bottom:5px}.item button{margin-top:8px;width:100%}.notice{background:#eee6d5;border-left:4px solid #a3a985;padding:12px;border-radius:6px;line-height:1.7;white-space:pre-line}.story{background:#fffaf0;padding:14px;border-radius:12px;line-height:1.8;white-space:pre-line}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.footer{text-align:center;padding:22px;font-size:12px;color:#817667}@media(max-width:650px){.wrap{padding:12px}.grid{grid-template-columns:1fr}.wide{grid-column:auto}.scene{height:190px}.panel{padding:15px}.chair{font-size:38px}}

/* Gentle, lightweight feedback; no timer influences play. */
.scene{height:280px}.guest{position:absolute;left:46%;bottom:21%;z-index:3;padding:0;background:none;font-size:61px;line-height:1;filter:drop-shadow(0 3px 2px #5e4c3c44);animation:arrive .7s ease-out both, breathe 2.5s ease-in-out .7s infinite}.guest:hover{transform:scale(1.08)}.guest:focus-visible{outline:3px solid #866c50;border-radius:50%}.guest.arrival{animation:arrive .7s ease-out both,breathe 2.5s ease-in-out .7s infinite}.bubble{position:absolute;left:54%;top:19%;z-index:4;background:#fffaf0;border:2px solid #b7a78a;border-radius:18px;padding:8px 12px;font-size:14px;box-shadow:0 4px 9px #51463c22;animation:pop .35s ease-out both;max-width:42%;line-height:1.4}.dish{position:absolute;z-index:4;left:60%;bottom:25%;font-size:31px;animation:serve .6s ease-out both}.coin{position:absolute;z-index:5;left:58%;top:25%;font-size:30px;animation:floatcoin 1s ease-out both}.hint{position:absolute;right:10px;bottom:8px;font-size:12px;color:#584e43;background:#fff9e1cc;padding:5px 8px;border-radius:9px}.progress{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px}.step{font-size:12px;background:#e9e2d3;color:#786d5d;border-radius:16px;padding:5px 9px}.step.current{color:white;background:#8c987d}.step.done{background:#dce5d7;color:#536850}.action-btn{font-size:17px;min-width:150px;box-shadow:0 4px 0 #53654f;transition:transform .12s,box-shadow .12s}.action-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #53654f}@keyframes arrive{from{opacity:0;transform:translateX(80px)}to{opacity:1;transform:translateX(0)}}@keyframes breathe{50%{transform:translateY(-4px)}}@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}@keyframes serve{from{opacity:0;transform:translateX(90px) rotate(18deg)}to{opacity:1;transform:translateX(0) rotate(0)}}@keyframes floatcoin{from{opacity:0;transform:translateY(18px) scale(.5)}35%{opacity:1}to{opacity:1;transform:translateY(-12px) scale(1)}}@media(max-width:650px){.scene{height:230px}.guest{font-size:50px}.bubble{font-size:12px;left:48%;top:20%}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
</style></head><body><main class="wrap"><header class="top"><div><div class="small">一間藏在巷子裡的老宅早午餐店</div><h1>日光慢慢 <span style="font-size:.55em">｜巷口的故事</span></h1></div><div class="stats" id="stats"></div></header><div class="scene" aria-label="陽光照進老宅餐廳，窗邊擺著桌椅和植物"><div class="window"></div><div class="sun"></div><div class="sign">日光慢慢</div><div class="table"></div><div class="chair">🪑</div><div class="plant" id="plant">🪴</div><div class="decor" id="decor"></div><div id="sceneGuest"></div></div><div class="grid"><section class="panel wide"><h2 id="phaseTitle"></h2><div id="main"></div></section><section class="panel"><h2>📖 巷口的故事</h2><div class="story" id="story"></div></section><section class="panel"><h2>🌿 小店布置</h2><div id="shop"></div></section></div><div class="footer">慢慢來，今天也會是溫暖的一天。<br><button class="secondary" id="reset" style="margin-top:12px;font-size:12px">重新開始遊戲</button></div></main><script>
const KEY='sunshine-cafe-v1';const menu=[{id:'toast',name:'🍞 奶油厚吐司',price:80},{id:'egg',name:'🍳 太陽蛋早午餐',price:120},{id:'coffee',name:'☕ 手沖咖啡',price:70},{id:'tea',name:'🍵 蜂蜜紅茶',price:60}];const furniture=[{id:'plant',name:'🌿 窗邊綠植',price:120},{id:'lamp',name:'💡 復古吊燈',price:180},{id:'photo',name:'🖼️ 木框照片',price:240}];const stories=['帶著舊相機的女孩走進店裡，坐在窗邊。\n「我叫小晴，昨天才搬到這附近。這裡的陽光真好。」','小晴再次推開門，手裡多了一卷底片。\n「我今天沿著巷子散步，拍到一隻在屋簷下睡覺的貓。」','小晴帶來沖洗好的照片，輕輕放在桌上。\n「搬來的時候有點緊張，但現在覺得，這條街好像慢慢變熟悉了。」','小晴又來喝下午茶，分享她在街角發現的小花店。\n「下次我想拍一張這間店的照片。」'];let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!state||!Array.isArray(state.selected)||!Array.isArray(state.owned)||!['setup','service','closed'].includes(state.phase))state={day:1,money:100,phase:'setup',selected:[],owned:[],served:0,stage:'order',order:null,storyCount:0,story:'故事會在招待熟客時自然展開。'};// Old saves used "order" for a customer whose order was already chosen.
if(state.phase==='service'&&state.stage==='order')state.stage='arrived';
if(state.phase==='service'&&!['arrived','ordered','ready','served'].includes(state.stage))state.stage='arrived';
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function newOrder(){state.order=state.selected[state.served%state.selected.length];state.stage='arrived'}
function act(){if(state.phase!=='service')return;const food=menu.find(x=>x.id===state.order);if(!food)return;
 if(state.stage==='arrived')state.stage='ordered';
 else if(state.stage==='ordered')state.stage='ready';
 else if(state.stage==='ready'){state.stage='served';if(state.served===0){state.story=stories[Math.min(state.storyCount,stories.length-1)];state.storyCount++}}
 else if(state.stage==='served'){state.money+=food.price;state.earned=(state.earned||0)+food.price;state.served++;if(state.served===3){state.phase='closed';state.order=null}else newOrder()}
 render();}
function render(){save();document.querySelector('#stats').innerHTML=`<span class="pill">☀️ 第 ${state.day} 天</span><span class="pill">🪙 ${state.money} 元</span><span class="pill">🍽️ 今日 ${state.served} / 3 位</span>`;
 document.querySelector('#plant').textContent=state.owned.includes('plant')?'🌳':'🪴';document.querySelector('#decor').textContent=(state.owned.includes('lamp')?'💡 ':'')+(state.owned.includes('photo')?'🖼️':'');document.querySelector('#story').textContent=state.story;
 document.querySelector('#shop').innerHTML=furniture.map(x=>`<div class="item" style="margin-bottom:8px"><strong>${x.name}</strong>${state.owned.includes(x.id)?'已擁有':`${x.price} 元 <button data-buy="${x.id}" ${state.money<x.price?'disabled':''}>添購</button>`}</div>`).join('');
 let title='',html='',scene='';
 if(state.phase==='setup'){title='① 準備今天的菜單';html='<div class="notice">選擇兩道餐點或飲品，客人會從中自己點餐。沒有倒數計時，慢慢來就好。</div><div class="items" style="margin-top:12px">'+menu.map(x=>`<div class="item"><strong>${x.name}</strong>${x.price} 元<button class="${state.selected.includes(x.id)?'':'secondary'}" data-select="${x.id}">${state.selected.includes(x.id)?'✓ 已選擇':'選入菜單'}</button></div>`).join('')+'</div><div class="actions"><button id="open" '+(state.selected.length===2?'':'disabled')+'>開始營業（已選 '+state.selected.length+' / 2）</button></div>';}
 else if(state.phase==='service'){
  const food=menu.find(x=>x.id===state.order),n=state.served,guest=['👧🏻','👩🏻‍💼','👴🏻'][n],customer=['熟客小晴','巷口的上班族','附近的鄰居'][n],stage=state.stage;
  const data={arrived:{bubble:'想點餐了！',notice:`${customer} 坐下了，快來幫忙點餐。`,button:'📝 幫客人點餐'},ordered:{bubble:`我要 ${food.name}`,notice:`${customer} 點了 ${food.name}（${food.price} 元）。`,button:'🍳 製作餐點'},ready:{bubble:'餐點準備好了！',notice:`${food.name} 做好了，請送給 ${customer}。`,button:'🍽️ 送上餐點'},served:{bubble:'謝謝！我要結帳。',notice:`${customer} 用餐完畢，等待妳收款 ${food.price} 元。`,button:'🪙 收錢'}}[stage];
  const idx=['arrived','ordered','ready','served'].indexOf(stage);const labels=['點餐','製作','送餐','收錢'];
  title='② 營業時間';html=`<div class="progress">${labels.map((x,i)=>`<span class="step ${i===idx?'current':i<idx?'done':''}">${i<idx?'✓ ':''}${x}</span>`).join('')}</div><div class="notice">${data.notice}</div><div class="actions"><button class="action-btn" id="action">${data.button}</button></div><p class="small">也可以點畫面裡的客人來進行下一步，沒有時間限制。</p>`;
  scene=`<button class="guest ${stage==='arrived'?'arrival':''}" id="guest" aria-label="${data.button}：${customer}">${guest}</button><div class="bubble">${data.bubble}</div>${stage==='ready'||stage==='served'?`<div class="dish">${food.name.split(' ')[0]}</div>`:''}${stage==='served'?'<div class="coin">🪙</div>':''}<div class="hint">👆 點客人或下方按鈕互動</div>`;
 }else{title='③ 今天打烊了';html=`<div class="notice">辛苦了！今天招待了 3 位客人，收入 ${state.earned} 元。\n可以用收入添購布置，再迎接新的一天。</div><div class="actions"><button id="next">迎接第 ${state.day+1} 天</button></div>`}
 document.querySelector('#sceneGuest').innerHTML=scene;document.querySelector('#phaseTitle').textContent=title;document.querySelector('#main').innerHTML=html;bind()}
function bind(){document.querySelectorAll('[data-select]').forEach(b=>b.onclick=()=>{let id=b.dataset.select;if(state.selected.includes(id))state.selected=state.selected.filter(x=>x!==id);else if(state.selected.length<2)state.selected.push(id);render()});document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{let x=furniture.find(y=>y.id===b.dataset.buy);if(!state.owned.includes(x.id)&&state.money>=x.price){state.money-=x.price;state.owned.push(x.id);render()}});let open=document.querySelector('#open');if(open)open.onclick=()=>{state.phase='service';state.served=0;state.earned=0;newOrder();render()};let action=document.querySelector('#action');if(action)action.onclick=act;let guest=document.querySelector('#guest');if(guest)guest.onclick=act;let next=document.querySelector('#next');if(next)next.onclick=()=>{state.day++;state.phase='setup';state.selected=[];state.served=0;render()}}
document.querySelector('#reset').onclick=()=>{if(confirm('確定要重新開始嗎？目前進度會被清除。')){try{localStorage.removeItem(KEY)}catch(e){}location.reload()}};render();
</script></body></html>
